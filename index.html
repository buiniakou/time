<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Progress</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: #f2f1ed; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.card { background: #fff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); padding: 2rem; width: 100%; max-width: 720px; }
.face-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.face-tab { padding: 6px 14px; border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.18); background: transparent; color: #666; font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.face-tab.active { background: #111; color: #fff; border-color: #111; }
.face-tab:hover:not(.active) { background: #f5f5f3; color: #111; }
.face { display: none; }
.face.visible { display: block; }
.section-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }

/* Face 0 — Classic bar */
.bar-wrap { position: relative; height: 56px; background: #f5f5f3; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.1); overflow: hidden; margin-bottom: 12px; }
.bar-fill { height: 100%; border-radius: 10px; background: #2a78d6; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; transition: width 0.5s ease; }
.bar-time-in  { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; }
.bar-time-out { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 13px; }
.hour-ticks { position: relative; height: 8px; margin-bottom: 4px; }
.hour-tick { position: absolute; top: 0; width: 1px; height: 8px; background: rgba(0,0,0,0.1); transform: translateX(-50%); }
.time-labels { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; }

/* Face 1 — Ring */
.ring-face { display: flex; gap: 2rem; align-items: center; }
.ring-stats { flex: 1; }
.stat-row { padding: 10px 0; border-bottom: 0.5px solid rgba(0,0,0,0.08); }
.stat-row:last-child { border-bottom: none; }
.stat-label { font-size: 12px; color: #999; margin-bottom: 2px; }
.stat-value { font-size: 18px; font-weight: 500; color: #111; }

/* Face 2 — Segments */
.segments-wrap { display: flex; gap: 3px; margin-bottom: 10px; }
.seg { flex: 1; height: 36px; border-radius: 4px; background: #f5f5f3; border: 0.5px solid rgba(0,0,0,0.1); transition: background 0.3s, border-color 0.3s; }
.seg.done    { background: #2a78d6; border-color: #2a78d6; }
.seg.current { background: #85b7eb; border-color: #85b7eb; }
.seg-labels  { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 1rem; }
.seg-legend  { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #666; flex-wrap: wrap; }
.seg-dot     { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Face 3 — Minimal */
.minimal-wrap { text-align: center; padding: 1rem 0; }
.minimal-time { font-size: clamp(48px, 10vw, 80px); font-weight: 500; color: #111; line-height: 1; margin-bottom: 6px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.minimal-sub  { font-size: 14px; color: #999; margin-bottom: 1.5rem; }
.minimal-bar  { height: 4px; background: #eeede9; border-radius: 2px; overflow: hidden; max-width: 420px; margin: 0 auto 8px; }
.minimal-fill { height: 100%; background: #111; border-radius: 2px; transition: width 0.5s; }
.minimal-ends { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; max-width: 420px; margin: 0 auto; }

/* Face 4 — Timeline */
.heat-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 10px; }
.heat-cell { height: 52px; border-radius: 6px; display: flex; flex-direction: column; justify-content: flex-end; padding: 5px 7px; background: #f5f5f3; border: 0.5px solid rgba(0,0,0,0.08); color: #aaa; }
.heat-cell.past { background: #2a78d6; border-color: #2a78d6; color: rgba(255,255,255,0.85); }
.heat-cell.now  { background: #1baf7a; border-color: #1baf7a; color: #fff; }
.heat-lbl { font-size: 10px; font-weight: 500; }
.heat-pct { font-size: 9px; opacity: 0.75; }

/* Status chips */
.status-bar  { display: flex; gap: 10px; margin-top: 1.5rem; flex-wrap: wrap; }
.status-chip { background: #f5f5f3; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #666; display: flex; align-items: center; gap: 6px; }
.status-chip i { font-size: 14px; }
.chip-val { font-weight: 500; color: #111; }
</style>
</head>
<body>
<div class="card">
  <div class="face-tabs">
    <button class="face-tab active" onclick="switchFace(0)">Classic bar</button>
    <button class="face-tab" onclick="switchFace(1)">Ring</button>
    <button class="face-tab" onclick="switchFace(2)">Segments</button>
    <button class="face-tab" onclick="switchFace(3)">Minimal</button>
    <button class="face-tab" onclick="switchFace(4)">Timeline</button>
  </div>

  <div class="face visible" id="face-0">
    <p class="section-label">Today's progress</p>
    <div class="bar-wrap">
      <div class="bar-fill" id="f0-fill" style="width:0%"><span class="bar-time-in" id="f0-in"></span></div>
      <span class="bar-time-out" id="f0-out"></span>
    </div>
    <div class="hour-ticks" id="f0-ticks"></div>
    <div class="time-labels"><span>9 AM</span><span>10</span><span>11</span><span>12 PM</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5 PM</span></div>
  </div>

  <div class="face" id="face-1">
    <div class="ring-face">
      <svg width="164" height="164" viewBox="0 0 160 160" role="img" aria-label="Progress ring" flex-shrink="0">
        <circle cx="80" cy="80" r="68" fill="none" stroke="#f0f0ee" stroke-width="12"/>
        <circle cx="80" cy="80" r="68" fill="none" stroke="#2a78d6" stroke-width="12" id="ring-c"
          stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427"
          transform="rotate(-90 80 80)" style="transition:stroke-dashoffset 0.5s ease"/>
        <text x="80" y="74" text-anchor="middle" fill="#111" font-size="22" font-weight="500" font-family="Inter,system-ui" id="ring-pct">0%</text>
        <text x="80" y="94" text-anchor="middle" fill="#aaa" font-size="11" font-family="Inter,system-ui" id="ring-t">not started</text>
      </svg>
      <div class="ring-stats">
        <div class="stat-row"><div class="stat-label">Time elapsed</div><div class="stat-value" id="r-el">—</div></div>
        <div class="stat-row"><div class="stat-label">Time remaining</div><div class="stat-value" id="r-rem">—</div></div>
        <div class="stat-row"><div class="stat-label">Finish at</div><div class="stat-value">5:00 PM</div></div>
      </div>
    </div>
  </div>

  <div class="face" id="face-2">
    <p class="section-label">Hour blocks</p>
    <div class="segments-wrap" id="seg-wrap"></div>
    <div class="seg-labels"><span>9 AM</span><span>10</span><span>11</span><span>12 PM</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5 PM</span></div>
    <div class="seg-legend">
      <div class="seg-dot" style="background:#2a78d6"></div><span>Completed</span>
      <div class="seg-dot" style="background:#85b7eb;margin-left:6px"></div><span>In progress</span>
      <div class="seg-dot" style="background:#f0f0ee;border:0.5px solid rgba(0,0,0,0.1);margin-left:6px"></div><span>Upcoming</span>
    </div>
  </div>

  <div class="face" id="face-3">
    <div class="minimal-wrap">
      <div class="minimal-time" id="min-t">—</div>
      <div class="minimal-sub" id="min-sub">—</div>
      <div class="minimal-bar"><div class="minimal-fill" id="min-fill" style="width:0%"></div></div>
      <div class="minimal-ends"><span>9:00 AM</span><span>5:00 PM</span></div>
    </div>
  </div>

  <div class="face" id="face-4">
    <p class="section-label">Hour by hour</p>
    <div class="heat-grid" id="heat-grid"></div>
  </div>

  <div class="status-bar">
    <div class="status-chip"><i class="ti ti-clock" aria-hidden="true"></i> Progress <span class="chip-val" id="chip-pct">—</span></div>
    <div class="status-chip"><i class="ti ti-hourglass" aria-hidden="true"></i> Remaining <span class="chip-val" id="chip-rem">—</span></div>
    <div class="status-chip"><i class="ti ti-calendar" aria-hidden="true"></i> <span id="chip-date">—</span></div>
  </div>
</div>

<script>
const SH = 9, EH = 17;
function fmtDur(m) {
  if (m <= 0) return '0m';
  const h = Math.floor(m/60), mn = Math.round(m%60);
  return h > 0 ? h+'h '+(mn>0?mn+'m':'') : mn+'m';
}
(function buildTicks() {
  const w = document.getElementById('f0-ticks');
  for (let i=0; i<=8; i++) { const d=document.createElement('div'); d.className='hour-tick'; d.style.left=(i/8*100)+'%'; w.appendChild(d); }
})();
(function buildSegs() {
  const w = document.getElementById('seg-wrap');
  for (let i=0; i<8; i++) { const s=document.createElement('div'); s.className='seg'; s.id='seg-'+i; w.appendChild(s); }
})();
(function buildHeat() {
  const g = document.getElementById('heat-grid');
  for (let i=0; i<8; i++) {
    const c=document.createElement('div'); c.className='heat-cell'; c.id='heat-'+i;
    const h=SH+i, lbl=h<12?h+'AM':(h===12?'12PM':(h-12)+'PM');
    c.innerHTML='<div class="heat-lbl">'+lbl+'</div>'; g.appendChild(c);
  }
})();
function switchFace(n) {
  document.querySelectorAll('.face').forEach((f,i) => f.classList.toggle('visible', i===n));
  document.querySelectorAll('.face-tab').forEach((t,i) => t.classList.toggle('active', i===n));
}
function update() {
  const now=new Date();
  const start=new Date(now); start.setHours(SH,0,0,0);
  const end=new Date(now); end.setHours(EH,0,0,0);
  const total=end-start, elapsed=Math.max(0,Math.min(now-start,total));
  const pct=elapsed/total, pctInt=Math.round(pct*100);
  const elMin=elapsed/60000, remMin=Math.max(0,(total-elapsed)/60000);
  const before=now<start, after=now>end;
  const ts=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  const fill=document.getElementById('f0-fill');
  fill.style.width=(before?0:after?100:pct*100)+'%';
  const tin=document.getElementById('f0-in'), tout=document.getElementById('f0-out');
  if (before) { tin.textContent=''; tout.textContent='Not started'; }
  else if (after) { tin.textContent='Done!'; tout.textContent=''; }
  else if (pct>0.12) { tin.textContent=ts; tout.textContent=''; }
  else { tin.textContent=''; tout.textContent=ts; }

  const circ=2*Math.PI*68;
  document.getElementById('ring-c').style.strokeDashoffset=before?circ:after?0:circ*(1-pct);
  document.getElementById('ring-pct').textContent=pctInt+'%';
  document.getElementById('ring-t').textContent=before?'not started':after?'complete':ts;
  document.getElementById('r-el').textContent=before?'—':fmtDur(elMin);
  document.getElementById('r-rem').textContent=after?'—':fmtDur(remMin);

  for (let i=0; i<8; i++) {
    const s=document.getElementById('seg-'+i);
    const ss=new Date(now); ss.setHours(SH+i,0,0,0);
    const se=new Date(now); se.setHours(SH+i+1,0,0,0);
    s.className='seg'+(now>=se?' done':now>=ss?' current':'');
  }

  document.getElementById('min-t').textContent=ts;
  document.getElementById('min-fill').style.width=(pct*100)+'%';
  document.getElementById('min-sub').textContent=before?"Work day hasn't started":after?'Work day complete':pctInt+'% through · '+fmtDur(remMin)+' left';

  for (let i=0; i<8; i++) {
    const cell=document.getElementById('heat-'+i);
    const cs=new Date(now); cs.setHours(SH+i,0,0,0);
    const ce=new Date(now); ce.setHours(SH+i+1,0,0,0);
    const lbl=cell.querySelector('.heat-lbl').outerHTML;
    if (now>=ce) { cell.className='heat-cell past'; cell.innerHTML=lbl; }
    else if (now>=cs) { const p=Math.round(((now-cs)/(ce-cs))*100); cell.className='heat-cell now'; cell.innerHTML=lbl+'<div class="heat-pct">'+p+'%</div>'; }
    else { cell.className='heat-cell'; cell.innerHTML=lbl; }
  }

  document.getElementById('chip-pct').textContent=pctInt+'%';
  document.getElementById('chip-rem').textContent=after?'Done':before?'All day':fmtDur(remMin);
  document.getElementById('chip-date').textContent=now.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
  setTimeout(update, 1000 - now.getTime()%1000 + 20);
}
update();
</script>
</body>
</html>
